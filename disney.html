<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nobre+ | Disney</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <a href="index.html" class="logo-link" title="Nobre+"><img src="images/nobre-logo.png" alt="Nobre+" class="nav-brand-logo"></a>
        </div>
        <div class="nav-right">
            <img src="https://i.pinimg.com/736x/88/43/c1/8843c1bb59dcce43cd4c46b7e39220e2.jpg" alt="Perfil" class="profile-avatar">
        </div>
    </nav>

    <main>
        <section class="disney-hero">
            <div class="disney-hero-bg"></div>
            <div class="disney-hero-content">
                <h1 class="disney-title">DISNEY</h1>
                <p class="disney-subtitle">A magia que encanta gerações, só no Nobre+</p>
                <a href="index.html" class="back-home-btn"><span class="material-symbols-outlined">arrow_back</span> Voltar</a>
            </div>
        </section>

        <section class="disney-grid-section">
            <h2>Todos os Filmes Disney</h2>
            <div class="disney-movies-grid" id="disneyGrid"></div>
        </section>
    </main>

    <script src="theme.js?v=5"></script>
    <script src="movies-data.js?v=6"></script>
    <script src="database.js?v=5"></script>
    <script>
        if (!DB.isLoggedIn()) {
            window.location.href = 'login.html';
        }
        const disneyKeys = [
            "moana-2",
            "mufasa-o-rei-leao",
            "avatar-o-caminho-da-agua",
            "zotopia",
            "alvin"
        ];

        const grid = document.getElementById('disneyGrid');

        disneyKeys.forEach(key => {
            const movie = moviesDatabase[key];
            if (!movie) return;
            const thumb = movie.thumb || movie.heroImg;
            grid.innerHTML += `
                <a href="detalhes.html?id=${key}" class="disney-movie-card">
                    <img src="${thumb}" alt="${movie.title}">
                    <div class="disney-card-overlay">
                        <h4>${movie.title}</h4>
                        <div class="card-meta">
                            <span class="badge-age ${movie.ageClass || 'r12'}">${movie.age || 'L'}</span>
                            <span class="badge-res">${movie.res || 'HD'}</span>
                        </div>
                    </div>
                </a>`;
        });
    </script>
</body>
</html>

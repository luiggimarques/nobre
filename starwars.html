<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nobre+ | Star Wars</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <a href="index.html" class="logo-link" title="Nobre+"><img src="images/nobre-logo.png" alt="Nobre+" class="nav-brand-logo"></a>
        </div>
        <div class="nav-right">
            <img src="https://i.pinimg.com/736x/88/43/c1/8843c1bb59dcce43cd4c46b7e39220e2.jpg" alt="Perfil" class="profile-avatar">
        </div>
    </nav>

    <main>
        <section class="starwars-hero">
            <div class="starwars-hero-bg"></div>
            <div class="starwars-hero-content">
                <h1 class="starwars-title">STAR WARS</h1>
                <p class="starwars-subtitle">Que a Força esteja com você, em todos os filmes do Nobre+</p>
                <a href="index.html" class="back-home-btn"><span class="material-symbols-outlined">arrow_back</span> Voltar</a>
            </div>
        </section>

        <section class="starwars-grid-section">
            <h2>Todos os Filmes Star Wars</h2>
            <div class="starwars-movies-grid" id="starwarsGrid"></div>
        </section>
    </main>

    <script src="theme.js"></script>
    <script src="movies-data.js"></script>
    <script src="database.js"></script>
    <script>
        if (!DB.isLoggedIn()) {
            window.location.href = 'login.html';
        }
        const starwarsKeys = [
            "star-wars-uma-nova-esperanca",
            "star-wars-imperio-contra-ataca",
            "star-wars-retorno-do-jedi",
            "star-wars-ameaca-fantasma",
            "star-wars-despertar-da-forca",
            "star-wars-rogue-one"
        ];

        const grid = document.getElementById('starwarsGrid');

        starwarsKeys.forEach(key => {
            const movie = moviesDatabase[key];
            if (!movie) return;
            const thumb = movie.thumb || movie.heroImg;
            grid.innerHTML += `
                <a href="detalhes.html?id=${key}" class="starwars-movie-card">
                    <img src="${thumb}" alt="${movie.title}">
                    <div class="starwars-card-overlay">
                        <h4>${movie.title}</h4>
                        <div class="card-meta">
                            <span class="badge-age ${movie.ageClass || 'r12'}">${movie.age || 'L'}</span>
                            <span class="badge-res">${movie.res || 'HD'}</span>
                        </div>
                    </div>
                </a>`;
        });
    </script>
</body>
</html>
